name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  malware-guard:
    name: Malware guard (PolinRider)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan for supply-chain malware markers
        run: bash .github/scripts/malware-scan.sh

  ci:
    needs: malware-guard
    name: build / test / wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build wasm (release)
        run: cargo build --locked --target wasm32v1-none --release

      - uses: actions/upload-artifact@v4
        with:
          name: escrow-wasm
          path: target/wasm32v1-none/release/escrow.wasm
